name: Build site to gh-pages

# Builds the static export and publishes it to the gh-pages branch.
# GitHub Pages serves that branch (Settings > Pages > Deploy from a branch > gh-pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            service/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # The KNIL service preview, served under /app next to the brand site.
      - run: npm ci
        working-directory: service
      - run: npm run build
        working-directory: service
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/app
      # GitHub Pages serves only the top-level 404.html for missing paths, so
      # the service's 404 (which renders /app/@handle creator pages) goes there.
      - run: |
          cp -r service/out out/app
          cp service/out/404.html out/404.html
      - name: Publish to gh-pages
        run: |
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
