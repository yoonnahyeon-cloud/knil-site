<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="screen.css">
<style>
.bar { height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-weight:700; font-size:22px; letter-spacing:-0.02em; }
.menu { display:grid; gap:4.5px; } .menu i { display:block; width:22px; height:2px; background:var(--ink); }
.head { display:flex; align-items:center; gap:24px; padding:6px 18px 0; }
.head .avatar { width:86px; height:86px; font-size:32px; }
.stats { display:flex; flex:1; justify-content:space-around; text-align:center; }
.stats b { display:block; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
.stats span { font-size:13px; color:#3a3a38; }
.bio { padding:14px 18px 0; font-size:14.5px; line-height:1.5; }
.bio .name { font-weight:700; }
.link { display:inline-flex; align-items:center; gap:6px; margin-top:3px; font-weight:700; font-size:15px; position:relative; }
.link svg { width:14px; height:14px; }
.link .u { position:absolute; left:20px; right:0; bottom:-3px; height:2px; background:var(--signal); }
.btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:16px 18px 0; }
.btns div { height:34px; border-radius:8px; display:grid; place-items:center; font-size:14px; font-weight:600; background:#efefed; }
.btns div:first-child { background:var(--ink); color:var(--white); }
.hl { display:flex; gap:16px; padding:18px 18px 0; }
.hl div { text-align:center; font-size:12px; color:#3a3a38; }
.hl i { display:block; width:62px; height:62px; border-radius:50%; border:1px solid var(--rule); margin-bottom:5px; padding:3px; background-clip:content-box; }
.tabs { display:grid; grid-template-columns:1fr 1fr 1fr; margin-top:18px; border-top:1px solid #ececea; }
.tabs i { height:44px; display:grid; place-items:center; }
.tabs i:first-child { border-bottom:1.5px solid var(--ink); }
.tabs i b { width:17px; height:17px; border:1.5px solid var(--ink); }
.tabs i:not(:first-child) b { border-color:#b5b5b2; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
.grid i { display:block; aspect-ratio:4/5; }
</style></head><body><div class="screen">
<div class="status"><span>9:41</span><span class="r"><span class="bars"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i></span><span class="bat"><i></i></span></span></div>
<div class="bar"><span>rosie</span><span class="menu"><i></i><i></i><i></i></span></div>
<div class="head"><div class="avatar">R</div>
  <div class="stats"><div><b>1,284</b><span>게시물</span></div><div><b>28.6만</b><span>팔로워</span></div><div><b>312</b><span>팔로잉</span></div></div></div>
<div class="bio"><div class="name">ROSIE</div><div>beauty, fashion, daily life</div>
  <div class="link"><svg viewBox="0 0 16 16" fill="none" stroke="#0c0c0b" stroke-width="1.6" stroke-linecap="round"><path d="M6.6 9.4a3 3 0 0 0 4.2 0l2.1-2.1a3 3 0 0 0-4.2-4.2l-.9.9"/><path d="M9.4 6.6a3 3 0 0 0-4.2 0L3.1 8.7a3 3 0 0 0 4.2 4.2l.9-.9"/></svg><span>knil.com/@rosie</span><i class="u"></i></div></div>
<div class="btns"><div>팔로우</div><div>메시지</div></div>
<div class="hl"><div><i style="background-color:var(--t3)"></i>Daily</div><div><i style="background-color:var(--t1)"></i>Beauty</div><div><i style="background-color:var(--t2)"></i>Look</div><div><i style="background-color:var(--t4)"></i>Shop</div></div>
<div class="tabs"><i><b></b></i><i><b></b></i><i><b></b></i></div>
<div class="grid"><i style="background:var(--t2)"></i><i style="background:var(--t5)"></i><i style="background:var(--t3)"></i><i style="background:var(--t1)"></i><i style="background:var(--t4)"></i><i style="background:var(--t2)"></i><i style="background:var(--t3)"></i><i style="background:var(--t1)"></i><i style="background:var(--t5)"></i></div>
</div></body></html>
